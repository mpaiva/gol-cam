; =============================================================
; gol-cam — Triple-environment monorepo
;
;   dfr1154        — Camera/detector board (ESP32-S3 DFR1154)
;   placar         — LED-matrix scoreboard (ESP32 DevKit V1 + 4x MAX7219)
;   crowpanel_hmi  — Touchscreen HMI placar (ESP32-S3-WROOM-1-N4R8 +
;                    5" 800×480 capacitive RGB panel, CrowPanel DIS07050H)
;
; Default env is dfr1154 so `pio run` keeps building the camera.
;   pio run -e placar         → MAX7219 scoreboard
;   pio run -e crowpanel_hmi  → touchscreen scoreboard / operator surface
;
; Sources for each env live in a sibling directory selected via
; build_src_filter so they never cross-contaminate:
;   dfr1154        ← src/
;   placar         ← src_scoreboard/scoreboard.cpp
;   crowpanel_hmi  ← src_hmi/
; =============================================================

[platformio]
default_envs = dfr1154

[env]
framework = arduino
extra_scripts = pre:load_env.py
monitor_speed = 115200

; ----- Camera / detector board -----
[env:dfr1154]
platform = espressif32
board = esp32-s3-devkitc-1

; DFR1154 has N16R8: 16MB Flash, 8MB PSRAM
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_ROLE_CAMERA=1

; Only compile camera firmware (exclude scoreboard + HMI sources)
build_src_filter =
    +<*>
    -<../src_scoreboard/>
    -<../src_hmi/>

upload_speed = 921600

; ----- Scoreboard board -----
[env:placar]
platform = espressif32
board = esp32dev

build_flags =
    -DBOARD_ROLE_PLACAR=1

lib_deps =
    majicdesigns/MD_MAX72XX@^3.5.0

; Compile only the hardware-debugged single-file scoreboard firmware
build_src_filter =
    -<*>
    +<../src_scoreboard/>

upload_speed = 460800
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001

; ----- CrowPanel HMI touchscreen (Phase 1: passive placar mirror) -----
[env:crowpanel_hmi]
platform = espressif32
board = esp32-s3-devkitc-1

; ESP32-S3-WROOM-1-N4R8 = 4 MB Flash, 8 MB OPI PSRAM, no OTA partition needed.
; board_build.flash_size sets the partition layout; board_upload.flash_size
; sets the size esptool stamps into the image header. Both must match the
; physical chip or the ROM bootloader refuses to load the image.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DBOARD_ROLE_HMI=1

; CrowPanel routes USB-C through a CH340 wired to UART0 (not the S3's
; native USB). Leave ARDUINO_USB_CDC_ON_BOOT/USB_MODE at their defaults
; so Arduino's `Serial` stays on UART0 → CH340 → /dev/cu.usbserial-*.

; Phase 2: Arduino_GFX gives us the parallel-RGB panel driver + a simple
; canvas API to draw text/shapes. We're not adding LVGL yet — the score
; screen doesn't need a retained-mode GUI. LVGL + GT911 touch driver come
; in Phase 3 when we wire up on-screen calibrate/start/VAR controls.
;
; Pinned to 1.4.x — 1.5+ requires the Arduino-ESP32 v3.x core (which uses
; the new HAL periman APIs); the PlatformIO espressif32 platform still
; ships the v2.x core, so the newer GFX won't compile here.
lib_deps =
    moononournation/GFX Library for Arduino@~1.4.0
    ; GT911 capacitive-touch driver (I2C). Phase 3a — touchscreen operator
    ; surface. Pinned ^1.0.x for the polling-mode API (no explicit INT/RST
    ; required, which matches the CrowPanel wiring).
    tamctec/TAMC_GT911@^1.0.2

build_src_filter =
    -<*>
    +<../src_hmi/>

; CH340 USB-UART on the CrowPanel — 460 800 is more reliable than 921 600.
upload_speed = 460800
